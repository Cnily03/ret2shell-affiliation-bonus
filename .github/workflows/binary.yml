name: Binary

on:
  push:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/binary.yml'
  pull_request:
    types:
      - review_requested
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/binary.yml'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: make deps

      - name: Build
        run: make build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: invite-bonus
          path: invite-bonus
          retention-days: 1
